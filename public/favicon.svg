  <path d="M40 150 Q40 70 75 90 Q110 110 100 150 Z" fill="#6B341A"/>
  <path d="M70 150 Q85 55 125 80 Q160 100 140 150 Z" fill="#8B4520"/>
  <path d="M105 150 Q120 60 160 85 Q180 100 170 150 Z" fill="#4F2714"/>
