  <path d="M65 90 Q75 75 90 90 Q85 95 75 95 Z" fill="#4A7C59"/>
  <path d="M115 80 Q125 65 140 80 Q135 85 125 85 Z" fill="#4A7C59"/>
  <!-- Sun -->
