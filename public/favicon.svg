  <!-- Sun rays -->
  <line x1="155" y1="36" x2="155" y2="30" stroke="#D07A3E" stroke-width="2" stroke-linecap="round"/>
  <line x1="168" y1="43" x2="173" y2="38" stroke="#D07A3E" stroke-width="2" stroke-linecap="round"/>
  <line x1="172" y1="55" x2="178" y2="55" stroke="#D07A3E" stroke-width="2" stroke-linecap="round"/>
  <line x1="168" y1="67" x2="173" y2="72" stroke="#D07A3E" stroke-width="2" stroke-linecap="round"/>
  <!-- Clouds -->
  <path d="M30 45 Q40 35 55 40 Q65 35 75 45" stroke="#E8B78E" stroke-width="2" fill="none"/>
  <path d="M50 55 Q60 48 70 52" stroke="#E8B78E" stroke-width="1.5" fill="none"/>
  <!-- Ground line -->
  <line x1="25" y1="150" x2="178" y2="150" stroke="#6B341A" stroke-width="2"/>
